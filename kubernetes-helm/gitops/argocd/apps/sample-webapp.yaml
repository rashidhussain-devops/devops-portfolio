apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rashidhussain-devops/devops-portfolio.git
    targetRevision: main
    path: kubernetes-helm/charts/sample-webapp
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
