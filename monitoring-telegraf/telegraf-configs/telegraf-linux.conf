# Telegraf agent config for Linux hosts (on-prem or Azure VMs).
# Ships to a central InfluxDB instance; Grafana reads from InfluxDB.

[agent]
  interval = "30s"
  flush_interval = "30s"
  hostname = "$HOSTNAME"

[[outputs.influxdb]]
  urls = ["http://<influxdb-host>:8086"]
  database = "telegraf"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.swap]]

[[inputs.processes]]

# Custom exec input pattern for anything not covered by a stock plugin —
# e.g. a backup job's last-success timestamp, exposed as InfluxDB line
# protocol by a small script. See ../scripts/check_backup_status.sh.
[[inputs.exec]]
  commands = ["/etc/telegraf/scripts/check_backup_status.sh"]
  timeout = "10s"
  data_format = "influx"
