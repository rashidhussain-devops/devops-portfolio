# Telegraf agent config for Windows Server hosts.
# win_perf_counters is the primary source — note the "------" instance
# workaround below, which is a real fix for a known Telegraf quirk where
# certain single-instance counters (like Memory) silently return no data
# unless the instance filter is explicitly set to a placeholder.

[agent]
  interval = "30s"
  flush_interval = "30s"

[[outputs.influxdb]]
  urls = ["http://<influxdb-host>:8086"]
  database = "telegraf"

[[inputs.win_perf_counters]]
  [[inputs.win_perf_counters.object]]
    ObjectName = "Processor"
    Instances = ["*"]
    Counters = ["% Processor Time"]
    Measurement = "cpu"

  [[inputs.win_perf_counters.object]]
    ObjectName = "Memory"
    # Single-instance counter — must be set to this placeholder or the
    # plugin silently returns zero series. See README for details.
    Instances = ["------"]
    Counters = ["Available MBytes", "% Committed Bytes In Use"]
    Measurement = "mem"

  [[inputs.win_perf_counters.object]]
    ObjectName = "LogicalDisk"
    Instances = ["*"]
    Counters = ["% Free Space", "Free Megabytes"]
    Measurement = "disk"

  [[inputs.win_perf_counters.object]]
    ObjectName = "Network Interface"
    Instances = ["*"]
    Counters = ["Bytes Total/sec"]
    Measurement = "net"

[[inputs.win_services]]
  service_names = [
    "W32Time",
    "RpcSs",
    "Dnscache",
    "LanmanServer",
    "LanmanWorkstation",
  ]
