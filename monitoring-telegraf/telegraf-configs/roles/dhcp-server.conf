# Role: on-prem Windows DHCP Server
#
# Scope-exhaustion (Nacks climbing, Requests outpacing Offers) is usually
# the first sign of a scope running out of leases before anyone notices
# clients failing to get an address.

[[inputs.win_perf_counters]]
  [[inputs.win_perf_counters.object]]
    ObjectName = "DHCP Server"
    Instances  = ["------"]
    Counters = [
      "Packets Received/sec",
      "Duplicates Dropped/sec",
      "Nacks/sec",
      "Declines/sec",
      "Offers/sec",
      "Requests/sec",
      "Informs/sec",
    ]
    Measurement = "dhcp_server"
