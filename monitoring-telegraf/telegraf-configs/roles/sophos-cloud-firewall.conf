# Role: Azure-hosted Sophos XG Firewall (cloud perimeter)
# Polled via SNMPv2 against the XG's management interface. Sophos XG exposes
# standard IF-MIB counters plus its own enterprise MIB for session/throughput
# stats; this config sticks to the standard MIB for portability, since the
# enterprise OIDs vary by firmware version.

[[inputs.snmp]]
  agents = ["udp://<sophos-xg-mgmt-ip>:161"]
  version = 2
  community = "<snmp-ro-community>"
  interval = "60s"
  name_override = "sophos_xg_cloud"

  [[inputs.snmp.field]]
    name = "hostname"
    oid  = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid  = "DISMAN-EVENT-MIB::sysUpTimeInstance"

  [[inputs.snmp.field]]
    name = "cpu_load"
    oid  = "UCD-SNMP-MIB::laLoad.1"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    oid  = "IF-MIB::ifTable"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid  = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid  = "IF-MIB::ifInOctets"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid  = "IF-MIB::ifOutOctets"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid  = "IF-MIB::ifOperStatus"
