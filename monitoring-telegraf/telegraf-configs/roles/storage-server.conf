# Role: on-prem file/storage server
#
# Per-volume free space plus disk I/O latency — free space alone misses a
# slowly-failing array that's still technically "not full" but is dropping
# in throughput.

[[inputs.disk]]
  mount_points = ["/", "/data", "/backups"]  # adjust to actual mounted shares
  ignore_fs = ["tmpfs", "devtmpfs"]

[[inputs.diskio]]
  # per-device read/write latency and IOPS

[[inputs.win_perf_counters]]
  [[inputs.win_perf_counters.object]]
    ObjectName = "LogicalDisk"
    Instances  = ["*"]
    Counters = [
      "% Free Space",
      "Free Megabytes",
      "Avg. Disk sec/Read",
      "Avg. Disk sec/Write",
      "Disk Reads/sec",
      "Disk Writes/sec",
    ]
    Measurement = "storage_disk"
