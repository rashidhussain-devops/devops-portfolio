# Role: Azure Application Gateway WAF
#
# WAF request/block metrics live in Azure Monitor, not on the appliance
# itself (there's no host to poll — it's a managed PaaS resource), so this
# uses inputs.exec to pull from the Azure Monitor Metrics REST API on a
# schedule and emit InfluxDB line protocol, rather than a native SNMP/agent
# collection.

[[inputs.exec]]
  commands = ["/etc/telegraf/scripts/get-waf-metrics.sh"]
  timeout  = "30s"
  interval = "300s"       # Azure Monitor metrics aggregate on a 1-5 min cadence
  data_format = "influx"
