# Role: on-prem Active Directory Domain Controller
#
# Layered on top of the base telegraf-windows.conf (CPU/mem/disk/net).
# These are the AD-specific counters worth alerting on: LSASS/NTDS
# performance (directory reads/writes, search rate) and Netlogon
# authentication latency, since AD slowness or auth failures are usually
# the first sign of a DC problem well before CPU/disk look unusual.

[[inputs.win_perf_counters]]
  [[inputs.win_perf_counters.object]]
    ObjectName = "NTDS"
    Instances  = ["------"]
    Counters = [
      "DS Directory Reads/sec",
      "DS Directory Writes/sec",
      "DS Directory Searches/sec",
      "LDAP Client Sessions",
      "LDAP Searches/sec",
      "LDAP Bind Time",
    ]
    Measurement = "ad_ntds"

  [[inputs.win_perf_counters.object]]
    ObjectName = "Netlogon"
    Instances  = ["------"]
    Counters = [
      "Semaphore Waiters",
      "Average Semaphore Hold Time",
    ]
    Measurement = "ad_netlogon"

  [[inputs.win_perf_counters.object]]
    ObjectName = "DFS Replicated Folders"
    Instances  = ["*"]
    Counters = [
      "Bandwidth Savings Using DFS Replication",
    ]
    Measurement = "ad_dfsr"
