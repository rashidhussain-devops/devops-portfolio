# Role: on-prem Barracuda CloudGen Firewall
#
# Same standard-MIB SNMP approach as the Sophos cloud firewall config, kept
# as a separate file (rather than parameterizing one file) so each
# appliance's community string, poll interval, and any vendor-specific OIDs
# can be tuned independently without risk of one firewall's config change
# affecting the other.

[[inputs.snmp]]
  agents = ["udp://<barracuda-mgmt-ip>:161"]
  version = 2
  community = "<snmp-ro-community>"
  interval = "60s"
  name_override = "barracuda_onprem"

  [[inputs.snmp.field]]
    name = "hostname"
    oid  = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid  = "DISMAN-EVENT-MIB::sysUpTimeInstance"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    oid  = "IF-MIB::ifTable"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid  = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid  = "IF-MIB::ifInOctets"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid  = "IF-MIB::ifOutOctets"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid  = "IF-MIB::ifOperStatus"
