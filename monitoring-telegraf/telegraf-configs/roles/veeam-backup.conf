# Role: on-prem Veeam Backup & Replication server
#
# Veeam doesn't expose job status via SNMP or perf counters, so this uses
# inputs.exec to run a PowerShell script (via Veeam's own PowerShell
# snap-in) that reports last-run status and job age as InfluxDB line
# protocol — the metric that actually matters operationally is "how long
# since each job last succeeded," not just "is the Veeam service running."

[[inputs.exec]]
  commands = ["powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\\telegraf\\scripts\\check-veeam-jobs.ps1"]
  timeout  = "60s"
  interval = "300s"
  data_format = "influx"
