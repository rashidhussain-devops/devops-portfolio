name: Nightly Terraform Drift Check

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform plan (detect drift only, no apply)
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init
          terraform plan -detailed-exitcode -no-color -out=/dev/null || echo "exit_code=$?" >> "$GITHUB_ENV"

      - name: Open issue if drift detected
        if: env.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected in ${{ matrix.env }}`,
              body: `The nightly drift check found unapplied changes in \`envs/${{ matrix.env }}\`. See the workflow run for the full plan output.`,
              labels: ['drift', 'infra']
            });
